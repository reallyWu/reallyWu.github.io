// ================= Render =================
function renderAside() {
  const el = document.getElementById('asideMenu');
  el.innerHTML = menuData.map(group => {
    const expanded = state.expandedGroups.includes(group.id);
    const hasChildren = group.children && group.children.length;
    const activeGroup = group.children && group.children.some(c => c.id === state.activeMenu);
    return `
      <div class="menu-group">
        <div class="menu-item ${activeGroup ? 'active' : ''} ${expanded ? 'expanded' : ''}" onclick="toggleGroup('${group.id}')">
          <span class="icon">${group.icon}</span>
          <span>${group.title}</span>
          ${hasChildren ? `<span class="arrow">▸</span>` : ''}
        </div>
        ${hasChildren ? `
          <div class="submenu ${expanded ? 'open' : ''}">
            ${group.children.map(child => `
              <div class="menu-item ${child.id === state.activeMenu ? 'active' : ''}" onclick="selectMenu('${child.id}')">${child.title}</div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

function renderMain() {
  const main = document.getElementById('main');
  const pageId = state.activeMenu;
  const renderFn = pageRenderers[pageId] || pageRenderers['miniapp-basic'];
  main.innerHTML = renderFn();
  attachInteractions();
}

function toggleGroup(id) {
  if (state.expandedGroups.includes(id)) {
    state.expandedGroups = state.expandedGroups.filter(g => g !== id);
  } else {
    state.expandedGroups.push(id);
  }
  renderAside();
}

function selectMenu(id) {
  state.activeMenu = id;
  const parent = menuData.find(g => g.children && g.children.some(c => c.id === id));
  if (parent && !state.expandedGroups.includes(parent.id)) {
    state.expandedGroups.push(parent.id);
  }
  renderAside();
  renderMain();
}

// ================= Interactions =================
function attachInteractions() {
  document.querySelectorAll('.tabs').forEach(tabContainer => {
    tabContainer.querySelectorAll('.tab-item').forEach(tab => {
      tab.addEventListener('click', () => {
        tabContainer.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      });
    });
  });
  document.querySelectorAll('.switch').forEach(sw => {
    sw.addEventListener('click', () => sw.classList.toggle('on'));
  });
}

function switchGame(el, name) {
  document.querySelectorAll('.game-entry').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  state.activeGame = name;
}

// Modal
function showModal(title, bodyHtml, onConfirm) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  state.modalCallback = onConfirm;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  state.modalCallback = null;
}
function modalConfirm() {
  if (state.modalCallback) state.modalCallback();
  closeModal();
}
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target.id === 'modalOverlay') closeModal();
});

function editActivity(index) {
  const act = activityData[index];
  const urlOptions = ['不跳转','文章ID','URL','调起微信分享','公众号文章','视频号视频','小程序内页面'];
  const optionsHtml = urlOptions.map(o => `<option value="${o}" ${act.urlType === o ? 'selected' : ''}>${o}</option>`).join('');
  const body = `
    <div class="form-row"><div class="form-label">内容ID</div><div class="form-control"><input type="text" id="editActId" value="${act.id}" disabled /></div></div>
    <div class="form-row"><div class="form-label">内容描述</div><div class="form-control"><input type="text" id="editActDesc" value="${act.desc}" /></div></div>
    <div class="form-row"><div class="form-label">内容权重</div><div class="form-control"><input type="number" id="editActWeight" value="${act.weight}" /></div></div>
    <div class="form-row"><div class="form-label">开始时间</div><div class="form-control"><input type="text" id="editActStart" value="${act.start}" /></div></div>
    <div class="form-row"><div class="form-label">结束时间</div><div class="form-control"><input type="text" id="editActEnd" value="${act.end}" /></div></div>
    <div class="form-row"><div class="form-label">URL或调起功能</div><div class="form-control"><select id="editActUrlType" onchange="onUrlTypeChange(this)">${optionsHtml}</select></div></div>
    <div class="form-row" id="urlValueRow" style="${act.urlType === '不跳转' ? 'display:none' : ''}"><div class="form-label">对应值</div><div class="form-control"><input type="text" id="editActUrlValue" value="${act.urlValue}" /></div></div>
    <div class="form-row"><div class="form-label">上架开关</div><div class="form-control"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><span class="switch ${act.onShelf ? 'on' : ''}" id="editActSwitch" onclick="this.classList.toggle('on')"></span><span>启用</span></label></div></div>
  `;
  showModal('编辑内容', body, () => saveActivity(index));
}

function onUrlTypeChange(select) {
  const row = document.getElementById('urlValueRow');
  if (row) row.style.display = select.value === '不跳转' ? 'none' : '';
}

function saveActivity(index) {
  const act = activityData[index];
  act.desc = document.getElementById('editActDesc').value;
  act.weight = parseInt(document.getElementById('editActWeight').value, 10) || 0;
  act.start = document.getElementById('editActStart').value;
  act.end = document.getElementById('editActEnd').value;
  act.urlType = document.getElementById('editActUrlType').value;
  act.urlValue = document.getElementById('editActUrlValue').value;
  act.onShelf = document.getElementById('editActSwitch').classList.contains('on');
  act.updated = new Date().toLocaleString('zh-CN', {hour12:false}).replace(/\//g,'-');
  act.operator = '吴文强';
  const now = new Date();
  const start = new Date(act.start);
  const end = new Date(act.end);
  if (now < start) act.status = '未开始';
  else if (now > end) act.status = '已结束';
  else act.status = '进行中';
  renderMain();
}

  lvl.benefitIds = Array.from(document.querySelectorAll('.edit-lvl-benefit'))
    .filter(cb => cb.checked)
    .map(cb => cb.value);
  const rewards = [];
  document.querySelectorAll('#gameRewardsList .game-group').forEach(group => {
    let gameId, gameName;
    const selectEl = group.querySelector('.game-select');
    if (selectEl) {
      gameId = selectEl.value;
      if (!gameId) return;
      const selectedGame = gameConfigData.find(g => g.gamecod === gameId);
      gameName = selectedGame ? selectedGame.name : gameId;
    } else {
      gameId = group.querySelector('.game-id').value.trim();
      gameName = group.querySelector('.game-name').value.trim();
    }
    if (!gameId) return;
    const packageIds = Array.from(group.querySelectorAll('.edit-lvl-pkg:checked'))
      .map(cb => cb.value);
    if (packageIds.length || gameId === 'general') rewards.push({ gameId, gameName: gameName || gameId, packageIds });
  });
  lvl.rewards = rewards;
  lvl.updated = new Date().toLocaleString('zh-CN', {hour12:false}).replace(/\//g,'-');
  lvl.operator = '吴文强';
  renderMain();
}

function previewIconUpload(input, previewId, hiddenId) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const url = e.target.result;
    const preview = document.getElementById(previewId);
    if (preview) {
      preview.style.background = 'url(' + url + ')';
      preview.style.backgroundSize = 'cover';
      preview.style.backgroundPosition = 'center';
    }
    const hidden = document.getElementById(hiddenId);
    if (hidden) hidden.value = url;
  };
  reader.readAsDataURL(file);
}

function saveRewardPackage(index) {
  const p = rewardPackageData[index];

    const name = row.querySelector('.pkg-item-name').value.trim();

function uploadPkgItemIcon(btn) {
  btn.nextElementSibling.click();
}

function previewPkgItemIcon(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const url = e.target.result;
    const container = input.closest('.pkg-item-row') || input.parentElement;
    const preview = container.querySelector('.icon-preview');
    if (preview) {
      preview.style.background = 'url(' + url + ')';
      preview.style.backgroundSize = 'cover';
      preview.style.backgroundPosition = 'center';
    }
    const txt = container.querySelector('.pkg-item-icon');
    if (txt) txt.value = url;
  };
  reader.readAsDataURL(file);
}
